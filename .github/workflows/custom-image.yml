name: Custom Hermes Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target Docker platform (verify against hermes-prod before deploy)"
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/arm64

# This workflow deliberately publishes only one platform per run. The existing
# official image manifest is amd64+arm64, but hermes-prod's host architecture is
# not visible from this development environment. Main pushes use amd64; an
# explicit arm64 dispatch is available once Ops confirms the host platform.
permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ch0meji/hermes-agent
  TARGET_PLATFORM: ${{ inputs.platform || 'linux/amd64' }}

jobs:
  publish:
    name: Build and publish custom image
    # Pushes publish only trusted main. A deliberate manual dispatch can build
    # a feature ref for staged self-deployment without merging it first.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read image version and build metadata
        id: image-metadata
        run: |
          set -euo pipefail
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$created" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          # Feature-branch dispatches publish only the immutable SHA tag;
          # reserve the floating latest tag for trusted main pushes.
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/ch0meji/hermes-agent
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.image-metadata.outputs.created }}
            org.opencontainers.image.title=Hermes Agent
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}

      - name: Pull published image for smoke validation
        run: docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Verify OCI image labels
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.image-metadata.outputs.version }}
          EXPECTED_CREATED: ${{ steps.image-metadata.outputs.created }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")" = "https://github.com/ch0meji/hermes-agent"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "${EXPECTED_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "${EXPECTED_VERSION}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "$image")" = "${EXPECTED_CREATED}"
          python3 - "${EXPECTED_CREATED}" <<'PY'
          from datetime import datetime
          import sys
          datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          print("OCI labels: source/revision/version/created verified")
          PY

      - name: Verify build provenance and imports
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(docker run --rm --entrypoint cat "${IMAGE_NAME}:sha-${GITHUB_SHA}" /opt/hermes/.hermes_build_sha)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python "${IMAGE_NAME}:sha-${GITHUB_SHA}" -c '
          import gateway.run_inbound
          import plugins.platforms.discord.adapter
          import plugins.platforms.discord.handoff
          from hermes_cli.build_info import get_build_sha
          assert get_build_sha(short=0) == "'"${EXPECTED_SHA}"'"
          print("imports: OK")
          print(f"build_sha: {get_build_sha(short=0)}")
          '

      - name: Verify Hermes CLI startup
        run: docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "${IMAGE_NAME}:sha-${GITHUB_SHA}" --version

      - name: Verify runtime tools on the Hermes user's PATH
        run: |
          set -euo pipefail
          docker run --rm --user hermes --env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin --entrypoint /bin/sh "${IMAGE_NAME}:sha-${GITHUB_SHA}" -ec '
            test "$(id -un)" = hermes
            for tool in gh jq rsync hermes; do command -v "$tool" >/dev/null; done
            hermes --version >/dev/null
            gh --version >/dev/null
            jq --version >/dev/null
            rsync --version >/dev/null
          '

      - name: Write published digest summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Custom Hermes image"
            echo "- image: ${IMAGE_NAME}"
            echo "- platform: ${TARGET_PLATFORM}"
            echo "- tag: sha-${GITHUB_SHA}"
            echo "- digest: ${IMAGE_DIGEST}"
            echo "- build SHA: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
